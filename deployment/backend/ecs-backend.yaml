AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ECS Backend deployment using ECS Service Connect.
  Backend does not use a Load Balancer.

Parameters:

  BackendImage:
    Type: String

  VpcId:
    Type: AWS::EC2::VPC::Id

  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>


Resources:

  # --------------------------------------------------
  # Backend Security Group
  # --------------------------------------------------

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for backend ECS tasks
      VpcId: !Ref VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80

          # Only frontend ECS tasks can access backend
          SourceSecurityGroupId:
            Fn::ImportValue: FrontendSecurityGroupId

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


  # --------------------------------------------------
  # Backend CloudWatch Logs
  # --------------------------------------------------

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/backend
      RetentionInDays: 7


  # --------------------------------------------------
  # Backend ECS Task Definition
  # --------------------------------------------------

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: backend

      NetworkMode: awsvpc

      RequiresCompatibilities:
        - FARGATE

      Cpu: '256'
      Memory: '512'

      ExecutionRoleArn:
        Fn::ImportValue: ECSTaskExecutionRoleArn

      ContainerDefinitions:

        - Name: backend

          Image: !Ref BackendImage

          Essential: true

          PortMappings:
            - Name: backend
              ContainerPort: 80
              Protocol: tcp

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend


  # --------------------------------------------------
  # Backend ECS Service
  # --------------------------------------------------

  BackendService:
    Type: AWS::ECS::Service

    DependsOn:
      - BackendSecurityGroup

    Properties:

      ServiceName: backend

      # Import cluster created by frontend stack
      Cluster:
        Fn::ImportValue: ECSClusterName

      TaskDefinition: !Ref BackendTaskDefinition

      DesiredCount: 1

      LaunchType: FARGATE

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp: ENABLED

          Subnets: !Ref PublicSubnets

          SecurityGroups:
            - !Ref BackendSecurityGroup


      # Backend exposes itself through Service Connect.
      # Frontend can access it using:
      #
      # http://backend:80

      ServiceConnectConfiguration:

        Enabled: true

        Namespace:
          Fn::ImportValue: ServiceConnectNamespaceArn

        Services:

          - PortName: backend

            DiscoveryName: backend

            ClientAliases:

              - Port: 80

                DnsName: backend


# --------------------------------------------------
# Outputs
# --------------------------------------------------

Outputs:

  BackendServiceName:
    Description: Backend ECS service
    Value: !Ref BackendService


  BackendSecurityGroupId:
    Description: Backend ECS security group
    Value: !Ref BackendSecurityGroup
