AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ECS Backend deployment using ECS EC2 launch type and Service Connect.
  Backend is accessed by the Frontend through Service Connect.
  No Load Balancer is used for the Backend.

Parameters:

  BackendImage:
    Type: String

  VpcId:
    Type: AWS::EC2::VPC::Id

  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>


Resources:

  # ------------------------------------------------------------
  # Backend CloudWatch Logs
  # ------------------------------------------------------------

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/backend
      RetentionInDays: 7


  # ------------------------------------------------------------
  # Backend ECS Task Definition
  # ------------------------------------------------------------

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:

      Family: backend

      # EC2 + Docker bridge networking
      NetworkMode: bridge

      RequiresCompatibilities:
        - EC2

      Cpu: '256'

      # Reduced so it can run on the t3.micro
      Memory: '256'

      ExecutionRoleArn:
        Fn::ImportValue: ECSTaskExecutionRoleArn

      ContainerDefinitions:

        - Name: backend

          Image: !Ref BackendImage

          Essential: true

          PortMappings:
            - Name: backend

              # Backend listens on port 80 inside container
              ContainerPort: 80

              # ECS/Docker chooses a free host port
              HostPort: 0

              Protocol: tcp

          LogConfiguration:
            LogDriver: awslogs

            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend


  # ------------------------------------------------------------
  # Backend ECS Service
  # ------------------------------------------------------------

  BackendService:
    Type: AWS::ECS::Service

    Properties:

      ServiceName: backend

      # Use the cluster created by the Frontend stack
      Cluster:
        Fn::ImportValue: ECSClusterName

      TaskDefinition: !Ref BackendTaskDefinition

      DesiredCount: 1

      # EC2 launch type
      LaunchType: EC2

      # --------------------------------------------------------
      # Service Connect
      # --------------------------------------------------------
      #
      # Backend is the SERVER.
      # Frontend will discover it using:
      #
      # http://backend:80
      #
      # No hard-coded IP address is required.
      #

      ServiceConnectConfiguration:

        Enabled: true

        Namespace:
          Fn::ImportValue: ServiceConnectNamespaceArn

        Services:

          - PortName: backend

            DiscoveryName: backend

            ClientAliases:

              - Port: 80

                DnsName: backend


# ------------------------------------------------------------
# Outputs
# ------------------------------------------------------------

Outputs:

  BackendServiceName:
    Description: Backend ECS service name
    Value: !Ref BackendService