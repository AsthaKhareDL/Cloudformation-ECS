AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ECS Frontend deployment using ECS EC2 launch type and Service Connect.
  ALB is placed in front of the Frontend service.

Parameters:

  FrontendImage:
    Type: String

  VpcId:
    Type: AWS::EC2::VPC::Id

  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>

  FrontendDesiredCount:
  Type: Number
  Default: 1
Resources:

  # ------------------------------------------------------------
  # ECS Cluster
  # ------------------------------------------------------------

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: frontend-backend-cluster


  # ------------------------------------------------------------
  # IAM Role for ECS EC2 Instance
  # ------------------------------------------------------------

  ECSInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecs-ec2-instance-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role


  ECSInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ecs-ec2-instance-profile
      Roles:
        - !Ref ECSInstanceRole


  # ------------------------------------------------------------
  # ALB Security Group
  # ------------------------------------------------------------

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for frontend ALB
      VpcId: !Ref VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


  # ------------------------------------------------------------
  # ECS EC2 Instance Security Group
  # ------------------------------------------------------------

  ECSInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS EC2 instances
      VpcId: !Ref VpcId

      SecurityGroupIngress:

        # ALB -> Frontend container dynamic host port
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          SourceSecurityGroupId: !Ref ALBSecurityGroup

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


  # ------------------------------------------------------------
  # Allow ECS instances to communicate with each other
  # ------------------------------------------------------------

  ECSInstanceSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ECSInstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 32768
      ToPort: 65535
      SourceSecurityGroupId: !Ref ECSInstanceSecurityGroup


  # ------------------------------------------------------------
  # EC2 Launch Template
  # ------------------------------------------------------------

  ECSLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:

        # Latest ECS optimized Amazon Linux 2023 AMI
        ImageId: '{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id}}'

        # Low-cost EC2 instance for demo
        InstanceType: t3.micro

        IamInstanceProfile:
          Name: !Ref ECSInstanceProfile

        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
              - !Ref ECSInstanceSecurityGroup

        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${ECSCluster} >> /etc/ecs/ecs.config


  # ------------------------------------------------------------
  # Auto Scaling Group
  # ------------------------------------------------------------

  ECSAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '1'
      MaxSize: '1'
      DesiredCapacity: '1'

      VPCZoneIdentifier: !Ref PublicSubnets

      LaunchTemplate:
        LaunchTemplateId: !Ref ECSLaunchTemplate
        Version: !GetAtt ECSLaunchTemplate.LatestVersionNumber


  # ------------------------------------------------------------
  # Cloud Map / Service Connect Namespace
  # ------------------------------------------------------------

  ServiceConnectNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: demo.local
      Vpc: !Ref VpcId


  # ------------------------------------------------------------
  # ECS Task Execution Role
  # ------------------------------------------------------------

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecs-task-execution-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy


  # ------------------------------------------------------------
  # Frontend CloudWatch Logs
  # ------------------------------------------------------------

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/frontend
      RetentionInDays: 7


  # ------------------------------------------------------------
  # Frontend ECS Task Definition
  # ------------------------------------------------------------

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:

      Family: frontend

      # EC2 + Docker bridge networking
      NetworkMode: bridge

      RequiresCompatibilities:
        - EC2

      Cpu: '256'

      # Reduced so it can fit on t3.micro
      Memory: '256'

      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn

      ContainerDefinitions:

        - Name: frontend

          Image: !Ref FrontendImage

          Essential: true

          PortMappings:
            - Name: frontend
              ContainerPort: 3000

              # ECS/Docker automatically selects a free host port
              HostPort: 0

              Protocol: tcp

          LogConfiguration:
            LogDriver: awslogs

            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend


  # ------------------------------------------------------------
  # Application Load Balancer
  # ------------------------------------------------------------

  FrontendALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:

      Name: frontend-alb

      Scheme: internet-facing

      Type: application

      Subnets: !Ref PublicSubnets

      SecurityGroups:
        - !Ref ALBSecurityGroup


  # ------------------------------------------------------------
  # Frontend Target Group
  # ------------------------------------------------------------

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:

      Name: frontend-target-group

      Port: 3000

      Protocol: HTTP

      # EC2 because we are using bridge networking
      TargetType: instance

      VpcId: !Ref VpcId

      HealthCheckPath: /

      HealthCheckProtocol: HTTP


  # ------------------------------------------------------------
  # ALB Listener
  # ------------------------------------------------------------

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:

      LoadBalancerArn: !Ref FrontendALB

      Port: 80

      Protocol: HTTP

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup


  # ------------------------------------------------------------
  # Frontend ECS Service
  # ------------------------------------------------------------

  FrontendService:
    Type: AWS::ECS::Service

    DependsOn:
      - FrontendTargetGroup
      - ALBListener
      - ServiceConnectNamespace
      - ECSAutoScalingGroup

    Properties:

      ServiceName: frontend

      Cluster: !Ref ECSCluster

      TaskDefinition: !Ref FrontendTaskDefinition

      DesiredCount: !Ref FrontendDesiredCount

      # EC2 launch type
      LaunchType: EC2

      # Register frontend with ALB
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 3000
          TargetGroupArn: !Ref FrontendTargetGroup

      # Frontend acts as a Service Connect client
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt ServiceConnectNamespace.Arn


# ------------------------------------------------------------
# Outputs
# ------------------------------------------------------------

Outputs:

  ALBURL:
    Description: Frontend ALB DNS name
    Value: !Sub
      - http://${DNSName}
      - DNSName: !GetAtt FrontendALB.DNSName


  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster
    Export:
      Name: ECSClusterName


  ServiceConnectNamespaceArn:
    Description: Service Connect namespace ARN
    Value: !GetAtt ServiceConnectNamespace.Arn
    Export:
      Name: ServiceConnectNamespaceArn


  ECSTaskExecutionRoleArn:
    Description: ECS task execution role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: ECSTaskExecutionRoleArn


  ECSInstanceSecurityGroupId:
    Description: ECS EC2 instance security group ID
    Value: !Ref ECSInstanceSecurityGroup
    Export:
      Name: ECSInstanceSecurityGroupId