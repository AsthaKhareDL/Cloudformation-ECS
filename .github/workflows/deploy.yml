name: Deploy ECS

on:
  workflow_dispatch:
    inputs:
      application:
        description: 'Select application to deploy'
        required: true
        type: choice
        options:
          - frontend
          - backend
          - both

      frontend_image_tag:
        description: 'Frontend image tag (leave blank to use latest)'
        required: false
        type: string

      backend_image_tag:
        description: 'Backend image tag (leave blank to use latest)'
        required: false
        type: string

env:
  AWS_REGION: us-east-1

  ECR_FRONTEND_REPOSITORY: frontend
  ECR_BACKEND_REPOSITORY: backend

  FRONTEND_STACK_NAME: ecs-frontend
  BACKEND_STACK_NAME: ecs-backend

jobs:
  deploy:
    name: Deploy ECS
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: image
        env:
          FRONTEND_INPUT_TAG: ${{ inputs.frontend_image_tag }}
          BACKEND_INPUT_TAG: ${{ inputs.backend_image_tag }}
        run: |
          if [ -z "$FRONTEND_INPUT_TAG" ]; then
            echo "frontend_tag=latest" >> "$GITHUB_OUTPUT"
            echo "Frontend image tag not provided. Using latest."
          else
            echo "frontend_tag=$FRONTEND_INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "Using frontend image tag: $FRONTEND_INPUT_TAG"
          fi

          if [ -z "$BACKEND_INPUT_TAG" ]; then
            echo "backend_tag=latest" >> "$GITHUB_OUTPUT"
            echo "Backend image tag not provided. Using latest."
          else
            echo "backend_tag=$BACKEND_INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "Using backend image tag: $BACKEND_INPUT_TAG"
          fi

      - name: Deploy Frontend
        if: ${{ inputs.application == 'frontend' || inputs.application == 'both' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.frontend_tag }}
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET_1: ${{ secrets.PUBLIC_SUBNET_1 }}
          SUBNET_2: ${{ secrets.PUBLIC_SUBNET_2 }}
        run: |
          echo "Deploying Frontend"
          echo "Image: $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"

          aws cloudformation deploy \
            --template-file deployment/frontend/ecs-frontend.yaml \
            --stack-name "$FRONTEND_STACK_NAME" \
            --parameter-overrides \
              FrontendImage="$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
              VpcId="$VPC_ID" \
              PublicSubnets="$SUBNET_1,$SUBNET_2" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Deploy Backend
        if: ${{ inputs.application == 'backend' || inputs.application == 'both' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.backend_tag }}
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET_1: ${{ secrets.PUBLIC_SUBNET_1 }}
          SUBNET_2: ${{ secrets.PUBLIC_SUBNET_2 }}
        run: |
          echo "Deploying Backend"
          echo "Image: $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"

          aws cloudformation deploy \
            --template-file deployment/backend/ecs-backend.yaml \
            --stack-name "$BACKEND_STACK_NAME" \
            --parameter-overrides \
              BackendImage="$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" \
              VpcId="$VPC_ID" \
              PublicSubnets="$SUBNET_1,$SUBNET_2" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
