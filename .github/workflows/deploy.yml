name: Deploy ECS

on:
  workflow_dispatch:
    inputs:
      application:
        description: 'Select application to deploy'
        required: true
        type: choice
        options:
          - frontend
          - backend
          - both

      image_tag:
        description: 'Image tag (leave blank to use latest)'
        required: false
        type: string

env:
  AWS_REGION: us-east-1

  ECR_FRONTEND_REPOSITORY: frontend
  ECR_BACKEND_REPOSITORY: backend

  FRONTEND_STACK_NAME: ecs-frontend
  BACKEND_STACK_NAME: ecs-backend


jobs:

  deploy:
    name: Deploy ECS
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------
      # Checkout repository
      # --------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------
      # Configure AWS
      # --------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------
      # Login to ECR
      # --------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------
      # Determine image tag
      # --------------------------------------------

      - name: Set image tag
        id: image
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "No image tag provided. Using latest."
          else
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "Using image tag: $INPUT_TAG"
          fi


      # --------------------------------------------
      # Deploy Frontend
      # --------------------------------------------

      - name: Deploy Frontend
        if: ${{ inputs.application == 'frontend' || inputs.application == 'both' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET_1: ${{ secrets.PUBLIC_SUBNET_1 }}
          SUBNET_2: ${{ secrets.PUBLIC_SUBNET_2 }}

        run: |
          echo "Deploying Frontend"
          echo "Image: $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"

          aws cloudformation deploy \
            --template-file deployment/frontend/ecs-frontend.yaml \
            --stack-name "$FRONTEND_STACK_NAME" \
            --parameter-overrides \
              FrontendImage="$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
              VpcId="$VPC_ID" \
              PublicSubnets="$SUBNET_1,$SUBNET_2" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


      # --------------------------------------------
      # Deploy Backend
      # --------------------------------------------

      - name: Deploy Backend
        if: ${{ inputs.application == 'backend' || inputs.application == 'both' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET_1: ${{ secrets.PUBLIC_SUBNET_1 }}
          SUBNET_2: ${{ secrets.PUBLIC_SUBNET_2 }}

        run: |
          echo "Deploying Backend"
          echo "Image: $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"

          aws cloudformation deploy \
            --template-file deployment/backend/ecs-backend.yaml \
            --stack-name "$BACKEND_STACK_NAME" \
            --parameter-overrides \
              BackendImage="$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" \
              VpcId="$VPC_ID" \
              PublicSubnets="$SUBNET_1,$SUBNET_2" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
