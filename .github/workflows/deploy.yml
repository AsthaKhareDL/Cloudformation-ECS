name: ECS Deployment

on:
  workflow_dispatch:

    inputs:

      application:
        description: "Select application to deploy"
        required: true
        type: choice
        options:
          - frontend
          - backend
          - both

      frontend_image_tag:
        description: "Frontend ECR image tag. Leave empty to use latest."
        required: false
        type: string

      backend_image_tag:
        description: "Backend ECR image tag. Leave empty to use latest."
        required: false
        type: string


env:
  AWS_REGION: us-east-1

  ECR_FRONTEND_REPOSITORY: frontend
  ECR_BACKEND_REPOSITORY: backend

  FRONTEND_STACK_NAME: ecs-frontend
  BACKEND_STACK_NAME: ecs-backend


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout deployment repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Deploy Frontend
      # --------------------------------------------------------

      - name: Deploy Frontend
        if: ${{ inputs.application == 'frontend' || inputs.application == 'both' }}
        run: |

          FRONTEND_TAG="${{ inputs.frontend_image_tag }}"

          if [ -z "$FRONTEND_TAG" ]; then
            FRONTEND_TAG="latest"
          fi

          FRONTEND_IMAGE=$(aws sts get-caller-identity \
            --query Account \
            --output text).dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND_REPOSITORY}:${FRONTEND_TAG}

          echo "Deploying Frontend image:"
          echo "$FRONTEND_IMAGE"

          aws cloudformation deploy \
            --stack-name "$FRONTEND_STACK_NAME" \
            --template-file deployment/frontend/ecs-frontend.yaml \
            --parameter-overrides \
              FrontendImage="$FRONTEND_IMAGE" \
              VpcId="${{ secrets.VPC_ID }}" \
              PublicSubnets="${{ secrets.PUBLIC_SUBNET_1 }},${{ secrets.PUBLIC_SUBNET_2 }}" \
            --capabilities CAPABILITY_NAMED_IAM


      # --------------------------------------------------------
      # Deploy Backend
      # --------------------------------------------------------

      - name: Deploy Backend
        if: ${{ inputs.application == 'backend' || inputs.application == 'both' }}
        run: |

          BACKEND_TAG="${{ inputs.backend_image_tag }}"

          if [ -z "$BACKEND_TAG" ]; then
            BACKEND_TAG="latest"
          fi

          BACKEND_IMAGE=$(aws sts get-caller-identity \
            --query Account \
            --output text).dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPOSITORY}:${BACKEND_TAG}

          echo "Deploying Backend image:"
          echo "$BACKEND_IMAGE"

          aws cloudformation deploy \
            --stack-name "$BACKEND_STACK_NAME" \
            --template-file deployment/backend/ecs-backend.yaml \
            --parameter-overrides \
              BackendImage="$BACKEND_IMAGE" \
              VpcId="${{ secrets.VPC_ID }}" \
              PublicSubnets="${{ secrets.PUBLIC_SUBNET_1 }},${{ secrets.PUBLIC_SUBNET_2 }}" \
            --capabilities CAPABILITY_NAMED_IAM
