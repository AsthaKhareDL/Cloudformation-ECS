name: Build, Push and Deploy

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_FRONTEND_REPOSITORY: frontend
  ECR_BACKEND_REPOSITORY: backend
  STACK_NAME: ecs-frontend-backend

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # 4. Build and push Frontend image
      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG ./Fronted
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG


      # 5. Build and push Backend image
      - name: Build and push backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG ./Backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG



      # 7. Deploy CloudFormation
    

      - name: Deploy CloudFormation
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET_1: ${{ secrets.PUBLIC_SUBNET_1 }}
          SUBNET_2: ${{ secrets.PUBLIC_SUBNET_2 }}
        run: |
          echo "Deploying to VPC: $VPC_ID"
          echo "Using subnets: $SUBNET_1 and $SUBNET_2"

          aws cloudformation deploy \
            --template-file Cloudformation/ecs.yaml \
            --stack-name $STACK_NAME \
            --parameter-overrides \
              FrontendImage="$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
              BackendImage="$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" \
              VpcId="$VPC_ID" \
              PublicSubnets="$SUBNET_1,$SUBNET_2" \
            --capabilities CAPABILITY_NAMED_IAM
