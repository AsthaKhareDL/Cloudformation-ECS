AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ECS Frontend and Backend deployment using ECS Service Connect.
  ALB is placed only in front of the Frontend service.

Parameters:

  FrontendImage:
    Type: String
    Description: ECR image URI for the frontend

  BackendImage:
    Type: String
    Description: ECR image URI for the backend

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where ECS services will run

  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for ALB and ECS tasks


Resources:

  # --------------------------------------------------
  # ECS CLUSTER
  # --------------------------------------------------

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: frontend-backend-cluster


  # --------------------------------------------------
  # CLOUD MAP NAMESPACE
  # Used by ECS Service Connect
  # --------------------------------------------------

  ServiceConnectNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: demo.local
      Vpc: !Ref VpcId


  # --------------------------------------------------
  # SECURITY GROUP FOR ALB
  # --------------------------------------------------

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for frontend ALB
      VpcId: !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for frontend ECS tasks
      VpcId: !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for backend ECS tasks
      VpcId: !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref FrontendSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # --------------------------------------------------
  # SECURITY GROUP FOR ECS TASKS
  # --------------------------------------------------

  # ECSSecurityGroup:
  #   Type: AWS::EC2::SecurityGroup
  #   Properties:
  #     GroupDescription: Security group for ECS frontend and backend
  #     VpcId: !Ref VpcId

  #     SecurityGroupIngress:

  #       # Frontend traffic from ALB
  #       - IpProtocol: tcp
  #         FromPort: 3000
  #         ToPort: 3000
  #         SourceSecurityGroupId: !Ref ALBSecurityGroup

  #       # Backend traffic from ECS tasks
  #       - IpProtocol: tcp
  #         FromPort: 80
  #         ToPort: 80
  #         SourceSecurityGroupId: !Ref ECSSecurityGroup

  #     SecurityGroupEgress:

  #       - IpProtocol: -1
  #         CidrIp: 0.0.0.0/0


  # --------------------------------------------------
  # ECS TASK EXECUTION ROLE
  # --------------------------------------------------

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecs-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy


  # --------------------------------------------------
  # BACKEND LOG GROUP
  # --------------------------------------------------

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/backend
      RetentionInDays: 7


  # --------------------------------------------------
  # FRONTEND LOG GROUP
  # --------------------------------------------------

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/frontend
      RetentionInDays: 7


  # --------------------------------------------------
  # BACKEND TASK DEFINITION
  # --------------------------------------------------

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:

      Family: backend

      NetworkMode: awsvpc

      RequiresCompatibilities:
        - FARGATE

      Cpu: '256'
      Memory: '512'

      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn

      ContainerDefinitions:

        - Name: backend
          Image: !Ref BackendImage

          Essential: true

          PortMappings:
            - Name: backend
              ContainerPort: 80
              Protocol: tcp

          LogConfiguration:
            LogDriver: awslogs

            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend


  # --------------------------------------------------
  # FRONTEND TASK DEFINITION
  # --------------------------------------------------

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:

      Family: frontend

      NetworkMode: awsvpc

      RequiresCompatibilities:
        - FARGATE

      Cpu: '256'
      Memory: '512'

      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn

      ContainerDefinitions:

        - Name: frontend
          Image: !Ref FrontendImage

          Essential: true

          PortMappings:
            - Name: frontend
              ContainerPort: 3000
              Protocol: tcp

          LogConfiguration:
            LogDriver: awslogs

            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend


  # --------------------------------------------------
  # BACKEND ECS SERVICE
  # --------------------------------------------------

  BackendService:
    Type: AWS::ECS::Service

    DependsOn:
      - ServiceConnectNamespace

    Properties:

      ServiceName: backend

      Cluster: !Ref ECSCluster

      TaskDefinition: !Ref BackendTaskDefinition

      DesiredCount: 1

      LaunchType: FARGATE

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp: ENABLED

          Subnets: !Ref PublicSubnets

          SecurityGroups:
            - !Ref BackendSecurityGroup

      ServiceConnectConfiguration:

        Enabled: true

        Namespace: !Ref ServiceConnectNamespace

        Services:

          - PortName: backend
            DiscoveryName: backend

            ClientAliases:

              - Port: 80
                DnsName: backend


  # --------------------------------------------------
  # FRONTEND ECS SERVICE
  # --------------------------------------------------

  FrontendService:
    Type: AWS::ECS::Service

    DependsOn:
      - FrontendTargetGroup
      - ALBListener
      - ServiceConnectNamespace

    Properties:

      ServiceName: frontend

      Cluster: !Ref ECSCluster

      TaskDefinition: !Ref FrontendTaskDefinition

      DesiredCount: 1

      LaunchType: FARGATE

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp: ENABLED

          Subnets: !Ref PublicSubnets

          SecurityGroups:
            - !Ref FrontendSecurityGroup

      LoadBalancers:

        - ContainerName: frontend
          ContainerPort: 3000
          TargetGroupArn: !Ref FrontendTargetGroup

      ServiceConnectConfiguration:

        Enabled: true

        Namespace: !Ref ServiceConnectNamespace


  # --------------------------------------------------
  # APPLICATION LOAD BALANCER
  # --------------------------------------------------

  FrontendALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer

    Properties:

      Name: frontend-alb

      Scheme: internet-facing

      Type: application

      Subnets: !Ref PublicSubnets

      SecurityGroups:
        - !Ref ALBSecurityGroup


  # --------------------------------------------------
  # FRONTEND TARGET GROUP
  # --------------------------------------------------

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

    Properties:

      Name: frontend-target-group

      Port: 3000

      Protocol: HTTP

      TargetType: ip

      VpcId: !Ref VpcId

      HealthCheckPath: /

      HealthCheckProtocol: HTTP


  # --------------------------------------------------
  # ALB LISTENER
  # --------------------------------------------------

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener

    Properties:

      LoadBalancerArn: !Ref FrontendALB

      Port: 80

      Protocol: HTTP

      DefaultActions:

        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup


# --------------------------------------------------
# OUTPUTS
# --------------------------------------------------

Outputs:

  ALBURL:
    Description: Frontend ALB DNS name
    Value: !Sub
      - http://${DNSName}
      - DNSName: !GetAtt FrontendALB.DNSName

  ECSClusterName:
    Description: ECS Cluster
    Value: !Ref ECSCluster

  ServiceConnectNamespace:
    Description: Service Connect namespace
    Value: !Ref ServiceConnectNamespace
